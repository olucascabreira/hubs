name: Publicar imagem

# Publica a imagem no GitHub Container Registry (ghcr.io).
#
# E o que torna a instalacao replicavel: com a imagem publicada, subir o HUB
# passa a ser colar uma stack no Portainer — sem transferir codigo, sem
# construir em cada no, sem prender o servico a um no especifico.
#
#   git tag v1.0.0 && git push origin v1.0.0   -> publica :1.0.0, :1.0, :latest
#   push na main                               -> publica :main (para testes)

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Node para typecheck e testes
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Publicar imagem quebrada e pior do que nao publicar.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke

      - name: QEMU (para construir arm64 em runner amd64)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Use em HUB_IMAGE na stack do Portainer." >> $GITHUB_STEP_SUMMARY
