# ---------------------------------------------------------------------------
# HUB WuzAPI <-> Chatwoot — stack para Portainer + Traefik (Docker standalone)
#
# Portainer: Stacks -> Add stack -> Repository (ou cole este conteudo)
# As variaveis abaixo sao preenchidas em "Environment variables" no Portainer.
#
# Para Docker SWARM veja as notas no fim do arquivo: labels mudam de lugar e
# `build` nao e suportado (precisa de imagem publicada num registry).
# ---------------------------------------------------------------------------

services:
  hub:
    # Em Portainer com "Repository" o build acontece no proprio host.
    # Se preferir imagem pronta, troque por:  image: ghcr.io/SEU_USER/wuzapi-chatwoot-hub:latest
    build:
      context: ..
      dockerfile: Dockerfile
    image: wuzapi-chatwoot-hub:latest
    restart: unless-stopped

    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Precisa ser a URL que WuzAPI e Chatwoot usam para CHAMAR o HUB.
      # Publica (via Traefik):  https://${HUB_DOMAIN}
      # Interna (sem expor):    http://hub:3000   <- veja a nota 2 no fim
      PUBLIC_URL: ${HUB_PUBLIC_URL}

      ADMIN_TOKEN: ${ADMIN_TOKEN}

      # Banco e fila proprios do HUB — nao encoste no Postgres do Chatwoot.
      DATABASE_URL: postgres://hub:${POSTGRES_PASSWORD}@hub-postgres:5432/hub
      DATABASE_SSL: "false"
      REDIS_URL: redis://hub-redis:6379

      INBOUND_CONCURRENCY: ${INBOUND_CONCURRENCY:-8}
      OUTBOUND_CONCURRENCY: ${OUTBOUND_CONCURRENCY:-8}
      JOB_ATTEMPTS: ${JOB_ATTEMPTS:-5}
      JOB_BACKOFF_MS: ${JOB_BACKOFF_MS:-3000}
      MAX_MEDIA_BYTES: ${MAX_MEDIA_BYTES:-41943040}

      # Ligado so na homologacao: grava conteudo de conversas em disco.
      CAPTURE_RAW_WEBHOOKS: ${CAPTURE_RAW_WEBHOOKS:-false}
      CAPTURE_DIR: /data/captures
      CAPTURE_MAX_FILES: 200

      # Nome de servico na rede interna do Docker, nao a URL publica.
      DEFAULT_WUZAPI_BASE_URL: ${DEFAULT_WUZAPI_BASE_URL:-http://wuzapi:8080}
      DEFAULT_CHATWOOT_BASE_URL: ${DEFAULT_CHATWOOT_BASE_URL}
      DEFAULT_WUZAPI_EVENTS: ${DEFAULT_WUZAPI_EVENTS:-Message,ReadReceipt}
      CONTACT_IDENTIFIER_PREFIX: "wa:"

    volumes:
      - hub_captures:/data/captures

    networks:
      - hub_internal   # Postgres e Redis do proprio HUB
      - proxy          # Traefik
      - apps           # onde WuzAPI e Chatwoot ja rodam

    depends_on:
      hub-postgres:
        condition: service_healthy
      hub-redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"

      # Webhooks: precisam ser publicos (Chatwoot/WuzAPI chamam de fora).
      - "traefik.http.routers.hub.rule=Host(`${HUB_DOMAIN}`)"
      - "traefik.http.routers.hub.entrypoints=websecure"
      - "traefik.http.routers.hub.tls=true"
      - "traefik.http.routers.hub.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.hub.loadbalancer.server.port=3000"

      # /admin/* protegido por ADMIN_TOKEN, mas restringir por IP e barato.
      # Preencha ADMIN_ALLOWED_IPS (ex.: "203.0.113.4/32") para ativar.
      - "traefik.http.routers.hub-admin.rule=Host(`${HUB_DOMAIN}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.hub-admin.entrypoints=websecure"
      - "traefik.http.routers.hub-admin.tls=true"
      - "traefik.http.routers.hub-admin.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.hub-admin.priority=100"
      - "traefik.http.routers.hub-admin.middlewares=hub-admin-ipallow"
      - "traefik.http.routers.hub-admin.service=hub"
      - "traefik.http.middlewares.hub-admin-ipallow.ipallowlist.sourcerange=${ADMIN_ALLOWED_IPS:-0.0.0.0/0}"

  hub-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hub
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    networks:
      - hub_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 10s
      timeout: 5s
      retries: 10

  hub-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hub_redisdata:/data
    networks:
      - hub_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  # Rede privada da stack: so HUB, seu Postgres e seu Redis.
  hub_internal:
    driver: bridge

  # Rede do Traefik. `external: true` = ja existe, nao criar.
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

  # Rede onde WuzAPI e Chatwoot ja estao. Confirme com:
  #   docker network ls
  #   docker inspect <container_wuzapi> --format '{{json .NetworkSettings.Networks}}'
  apps:
    external: true
    name: ${APPS_NETWORK:-apps}

volumes:
  hub_pgdata:
  hub_redisdata:
  hub_captures:

# ---------------------------------------------------------------------------
# NOTA 1 — Docker Swarm
#   * `build:` nao funciona. Publique a imagem num registry e use `image:`.
#   * Labels do Traefik vao para `deploy.labels`, nao `labels`.
#   * `depends_on.condition` nao e suportado; o HUB ja tenta reconectar.
#
# NOTA 2 — Nao expor o HUB publicamente
#   Se WuzAPI e Chatwoot estiverem na MESMA rede docker do HUB, os dois podem
#   chamar `http://hub:3000` direto. Nesse caso:
#     PUBLIC_URL=http://hub:3000
#   e remova o bloco `labels` inteiro. Nada do HUB fica na internet.
#   Contrapartida: /admin/* so acessivel de dentro da rede.
#
# NOTA 3 — Reutilizar um Postgres existente
#   Remova os servicos hub-postgres/hub-redis e aponte DATABASE_URL/REDIS_URL
#   para os seus. O HUB cria as tabelas dele sozinho (prefixo proprio, sem
#   colisao com o schema do Chatwoot).
# ---------------------------------------------------------------------------
