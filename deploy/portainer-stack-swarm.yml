# ---------------------------------------------------------------------------
# HUB WuzAPI <-> Chatwoot — Docker SWARM + Portainer + Traefik
#
# Diferencas para o compose normal, todas obrigatorias no Swarm:
#   * `build:` nao existe — a imagem precisa ja estar disponivel (ver ANTES DE
#     SUBIR, no fim do arquivo).
#   * Labels do Traefik ficam em `deploy.labels`, nao em `labels`.
#   * `depends_on` e ignorado — o HUB tolera Postgres/Redis subindo depois.
#
# Portainer: Stacks -> Add stack -> Web editor -> cole este arquivo.
# ---------------------------------------------------------------------------

services:
  hub:
    image: ${HUB_IMAGE:-wuzapi-chatwoot-hub:latest}

    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # URL que WuzAPI e Chatwoot usam para CHAMAR o HUB. E ela que fica
      # gravada nos dois webhooks durante o provisionamento.
      PUBLIC_URL: ${HUB_PUBLIC_URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN}

      # Postgres e Redis proprios do HUB — sem encostar no banco do Chatwoot.
      DATABASE_URL: postgres://hub:${POSTGRES_PASSWORD}@hub-postgres:5432/hub
      DATABASE_SSL: "false"
      REDIS_URL: redis://hub-redis:6379

      INBOUND_CONCURRENCY: ${INBOUND_CONCURRENCY:-8}
      OUTBOUND_CONCURRENCY: ${OUTBOUND_CONCURRENCY:-8}
      JOB_ATTEMPTS: ${JOB_ATTEMPTS:-5}
      JOB_BACKOFF_MS: ${JOB_BACKOFF_MS:-3000}
      MAX_MEDIA_BYTES: ${MAX_MEDIA_BYTES:-41943040}

      # Grava o corpo cru dos webhooks: conteudo de conversas reais.
      # Ligue so durante a homologacao.
      CAPTURE_RAW_WEBHOOKS: ${CAPTURE_RAW_WEBHOOKS:-false}
      CAPTURE_DIR: /data/captures
      CAPTURE_MAX_FILES: 200

      # Nome do servico na rede do Swarm, nao a URL publica.
      DEFAULT_WUZAPI_BASE_URL: ${DEFAULT_WUZAPI_BASE_URL:-http://wuzapi_wuzapi-server:8080}
      DEFAULT_CHATWOOT_BASE_URL: ${DEFAULT_CHATWOOT_BASE_URL}
      DEFAULT_WUZAPI_EVENTS: ${DEFAULT_WUZAPI_EVENTS:-Message,ReadReceipt}
      CONTACT_IDENTIFIER_PREFIX: "wa:"

    volumes:
      - hub_captures:/data/captures

    networks:
      - network_public   # Traefik + WuzAPI + Chatwoot
      - hub_internal     # Postgres e Redis do HUB

    # `node` em vez de `wget`: esta garantido na imagem, e o timeout interno
    # faz o comando terminar mesmo se o endpoint travar.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:3000,path:'/health',timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        order: start-first
      resources:
        limits:
          memory: 512M

      # Swarm multi-no SEM registry: fixa o servico no no onde a imagem foi
      # construida. Sem isso o Swarm pode agendar num no que nao tem a imagem
      # e o servico fica preso em "no suitable node".
      #
      # ATENCAO nos dois sentidos:
      #   * BUILD_NODE_HOSTNAME vazio  -> constraint invalido, a stack nem sobe
      #   * usando REGISTRY            -> APAGUE estas 3 linhas, a imagem esta
      #                                   disponivel em qualquer no
      # Descubra o hostname com: docker node ls
      placement:
        constraints:
          - node.hostname == ${BUILD_NODE_HOSTNAME}

      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"

        # Webhooks: precisam ser publicos.
        - "traefik.http.routers.hub.rule=Host(`${HUB_DOMAIN}`)"
        - "traefik.http.routers.hub.entrypoints=websecure"
        - "traefik.http.routers.hub.tls=true"
        - "traefik.http.routers.hub.tls.certresolver=${CERT_RESOLVER:-letsencryptresolver}"
        - "traefik.http.routers.hub.service=hub"
        - "traefik.http.services.hub.loadbalancer.server.port=3000"

        # /admin/* ja exige ADMIN_TOKEN; a lista de IPs e uma trava a mais.
        # Deixe ADMIN_ALLOWED_IPS vazio para nao restringir.
        - "traefik.http.routers.hub-admin.rule=Host(`${HUB_DOMAIN}`) && PathPrefix(`/admin`)"
        - "traefik.http.routers.hub-admin.entrypoints=websecure"
        - "traefik.http.routers.hub-admin.tls=true"
        - "traefik.http.routers.hub-admin.tls.certresolver=${CERT_RESOLVER:-letsencryptresolver}"
        - "traefik.http.routers.hub-admin.priority=100"
        - "traefik.http.routers.hub-admin.service=hub"
        - "traefik.http.routers.hub-admin.middlewares=hub-admin-ipallow"
        - "traefik.http.middlewares.hub-admin-ipallow.ipallowlist.sourcerange=${ADMIN_ALLOWED_IPS:-0.0.0.0/0}"

  hub-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hub
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    networks:
      - hub_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M

  hub-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hub_redisdata:/data
    networks:
      - hub_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M

networks:
  # Ja existe no seu ambiente — nao deixe o Swarm recriar.
  network_public:
    external: true

  # Privada da stack: so HUB + seu Postgres + seu Redis.
  hub_internal:
    driver: overlay
    attachable: true

volumes:
  hub_pgdata:
  hub_redisdata:
  hub_captures:

# ---------------------------------------------------------------------------
# ANTES DE SUBIR — a imagem
#
# O Swarm nao constroi imagem. Duas opcoes:
#
# A) Swarm de UM no (mais simples). No manager:
#      git clone <este-repo> hub && cd hub
#      docker build -t wuzapi-chatwoot-hub:latest .
#    Depois suba a stack com HUB_IMAGE=wuzapi-chatwoot-hub:latest
#
# B) Swarm com VARIOS nos: a imagem precisa vir de um registry, senao os nos
#    que nao construiram nao conseguem iniciar o servico.
#      docker build -t ghcr.io/SEU_USER/wuzapi-chatwoot-hub:1.0.0 .
#      docker push ghcr.io/SEU_USER/wuzapi-chatwoot-hub:1.0.0
#    E HUB_IMAGE=ghcr.io/SEU_USER/wuzapi-chatwoot-hub:1.0.0
#
# VARIAVEIS no Portainer (Environment variables):
#   HUB_IMAGE                 wuzapi-chatwoot-hub:latest
#   HUB_DOMAIN                hub.impulsemidia.com.br
#   HUB_PUBLIC_URL            https://hub.impulsemidia.com.br
#   ADMIN_TOKEN               (openssl rand -hex 32)
#   POSTGRES_PASSWORD         (aleatorio)
#   CERT_RESOLVER             o resolver do SEU Traefik
#   DEFAULT_WUZAPI_BASE_URL   http://wuzapi_wuzapi-server:8080
#     ^ no Swarm o DNS do servico inclui o nome da stack: <stack>_<servico>.
#       Confirme a porta com: docker service inspect wuzapi_wuzapi-server
#   DEFAULT_CHATWOOT_BASE_URL https://chat.impulsemidia.com.br
#   CHATWOOT_ACCOUNT_ID       1  (informado ao criar o tenant, nao aqui)
#   CAPTURE_RAW_WEBHOOKS      true durante a homologacao
#   ADMIN_ALLOWED_IPS         seu IP em /32, se quiser restringir
# ---------------------------------------------------------------------------
